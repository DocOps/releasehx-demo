  summ: |
    Add batch export API endpoint
  head: Added batch export API endpoint
  note: |
    Implement `/api/export/batch` endpoint supporting CSV and JSON formats.
    
    A new batch export endpoint is now available at `/api/export/batch`. Supported formats:
    
    - CSV (default)
    - JSON with optional compression
    
    Example usage:
    
    ```bash
    curl -X POST /api/export/batch \
      -H "Content-Type: application/json" \
      -d '{"format": "csv", "ids": [1,2,3]}'
    ```
  tags:
